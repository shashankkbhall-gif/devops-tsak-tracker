
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task Tracker</title>
</head>
<body>
    <h1>DevOps Task Tracker</h1>

    <form method="POST">
        <input
            type="text"
            name="title"
            placeholder="Enter a task"
            required
        >
        <button type="submit">Add Task</button>
    </form>

    <h2>My Tasks</h2>
    <ul>
        {% for task in tasks %}
            <li>{{ task.title }}</li>
        {% else %}
            <li>No tasks yet. Add your first task!</li>
        {% endfor %}
    </ul>
</body>
</html>
